<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Captures d'un tour</title></head>
<body style="margin:0;background:#111;color:#ccc;font:13px monospace">
<pre id="log" style="margin:8px"></pre>
<script>
// Fait un tour en pilote auto et enregistre une capture 960 × 540 à intervalles réguliers, sans que personne regarde l'écran.
// À servir par outils/capture.py. Paramètres :
//   carte=ville|touge|wangan|paris|canal|stade|givre|terre   pas=10 (secondes de course entre deux captures)   tours=1   style=net (vide = rendu par défaut)
//   idx=700,1351   à la place de pas : une capture au passage de ces échantillons de piste (pour revoir un endroit précis)
//   mode=course   le mode de jeu (mémorisé comme au menu, sinon celui du navigateur) ; tour=3 : les captures idx seulement à partir de ce tour (avec tours=3)
//   vue=angle,distance,hauteur   caméra d'inspection autour de la voiture (window.__g.vue), sinon la caméra de course
//   degats=0.7   chaque zone de chaque voiture abîmée à ce niveau (0 à 1) dès le départ, au lieu de compter sur les chocs du pilote automatique
//   force=mur|murG|droit|nitro|glisse   avec idx : sur les 40 échantillons avant chaque capture, la voiture est poussée contre le mur de droite (murG : de gauche), ou va tout droit, cap bloqué 150 images (droit : dans le mur d'un virage ; en course le jeu appelle le pilote de sim.js sans passer par ce relais), ou la nitro tenue, ou la nitro tenue en glisse (pilote en glisse de sim.js) (le pilote auto ne fait ni l'un ni l'autre)
//   taille=1920x1080   taille de la page du jeu (960x540 par défaut) : avec le style net, la scène est rendue à cette résolution (plus fine que le jeu, pour la critique de détail)
//   jeu=1   chaque capture met côte à côte, à la même hauteur, le rendu réel du jeu (270 lignes, pixels agrandis, HUD) à gauche et le rendu du style (net par défaut) à droite
//   opt={"th":{…}}   options de carte essayées sans toucher à cartes.js (fusionnées dans la carte par game.js ; docs/MOTEUR-OPTIONS-CARTES.md)
// Résultat : captures/<carte>-NN.jpg et captures/<carte>.json = { vues: [{ n, t, idx, kmh, tunnel }], erreurs, msParImage, tour }.
// Quand le titre de la page passe à « FINI », tout est écrit.
(async () => {
  const q = new URLSearchParams(location.search), deg = +(q.get('degats') || 0), carte = q.get('carte') || 'ville', pas = +(q.get('pas') || 10), tours = +(q.get('tours') || 1), style = q.get('style') ?? 'net';
  const cibles = (q.get('idx') || '').split(',').filter(Boolean).map(Number), log = t => { document.getElementById('log').textContent += t + '\n'; };
  if (q.get('mode')) localStorage.setItem('vpr7.mode', JSON.stringify(q.get('mode')));
  const tour = +(q.get('tour') || 1), [LW, LH] = (q.get('taille') || '960x540').split('x').map(Number), erreurs = [], opt = q.get('opt') ? '&opt=' + encodeURIComponent(q.get('opt')) : '';
  const ouvre = async (st, lw, lh) => { // une page du jeu, pilotée image par image
    const f = document.createElement('iframe'); f.style.cssText = 'width:' + lw + 'px;height:' + lh + 'px;border:0;display:block';
    f.src = '../index.html?auto&carte=' + carte + (st ? '&style=' + st : '') + opt + '&v=' + Date.now(); document.body.append(f);
    await new Promise(r => { f.onload = r; });
    const w = f.contentWindow;
    w.console.error = (...a) => erreurs.push(a.join(' ').slice(0, 300)); w.addEventListener('error', e => erreurs.push(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
    w.requestAnimationFrame = () => 0; Object.defineProperty(w, 'devicePixelRatio', { get: () => 1 }); w.dispatchEvent(new Event('resize'));
    return w;
  };
  const w = await ouvre(style, LW, LH), wj = q.get('jeu') ? await ouvre('', 960, 540) : null;
  await new Promise(r => setTimeout(r, 1000));
  const g = w.__g, gj = wj && wj.__g; if (!g || wj && !gj) { log('ERREUR : le jeu ne démarre pas — ' + erreurs.join(' | ')); document.title = 'FINI (erreur)'; return; }
  if (gj && q.get('vue')) gj.vue = q.get('vue').split(',').map(Number);
  // jeu=1 : la page du rendu réel suit la voiture de la page principale (copie de son état à chaque image), puis les deux images sont collées
  const suit = t => { if (!gj) return; for (const k in g.car) if (typeof g.car[k] === 'number' || typeof g.car[k] === 'boolean') gj.car[k] = g.car[k]; gj.frame(t); };
  const image = async () => { const a = g.renderer.domElement; if (!gj) return a.toDataURL('image/jpeg', 0.8);
    const b = gj.renderer.domElement, kb = a.height / b.height, c = document.createElement('canvas'); c.width = Math.round(b.width * kb) + a.width; c.height = a.height;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(b, 0, 0, c.width - a.width, a.height); x.drawImage(a, c.width - a.width, 0); return c.toDataURL('image/jpeg', 0.85); };
  if (q.get('vue')) g.vue = q.get('vue').split(',').map(Number);
  const gl = g.renderer.getContext(), T = g.T, vues = [], post = (nom, corps) => fetch('/captures/' + nom, { method: 'POST', body: corps });
  const prise = async () => {
    const n = String(vues.length).padStart(2, '0'), c = g.car;
    await post(carte + '-' + n + '.jpg', await (await fetch(await image())).blob());
    vues.push({ n, t: +g.t.toFixed(1), idx: c.idx, kmh: Math.round(Math.hypot(c.vx, c.vz) * 3.6), tunnel: T.tun && ((c.idx - T.t0 + T.n) % T.n) < T.t1 - T.t0 });
    log(carte + '-' + n + '  t=' + g.t.toFixed(1) + ' s  échantillon ' + c.idx + '/' + T.n);
  };
  let forcer = ''; const ap = w.autopilot; w.autopilot = (...a) => { const r = ap(...a); if (forcer === 'nitro') r.nitro = r.gas = 1; if (forcer === 'glisse') Object.assign(r, w.piloteGlisse(a[1], 1, 1.2, 0.6, 0.2)(a[0]), { nitro: 1, gas: 1 }); if (forcer === 'mur') r.steer = 0.4; if (forcer === 'murG') r.steer = -0.4; if (forcer === 'droit') Object.assign(r, { steer: 0, gas: 1, brake: 0 }); forcer = ''; return r; }; // par la commande : sim.js remet c.boost à chaque pas, et le pilote ramène la voiture au milieu
  g.start(); if (gj) gj.start();
  let k = 0, dernier = -1;
  for (; k < 9000 && g.car.dist < T.n * tours - 3; k++) {
    const force = q.get('force'), c = g.car; if (force && cibles.some(i => ((i - c.idx + T.n + 8) % T.n) < 48)) { if (force === 'mur' || force === 'murG') { const s = T.S[c.idx], e = (force === 'mur' ? s.w : -s.w) - (c.d || 0); c.x -= s.tz * e; c.z += s.tx * e; } else if (force === 'droit') { c.thDroit ??= c.th; if ((c.nDroit = (c.nDroit || 0) + 1) < 150) { c.th = c.thDroit; c.yaw = 0; } } else c.nitro = 1; forcer = force; } else if (c.thDroit != null) c.thDroit = c.nDroit = null;
    g.frame(1e7 + k * 100); suit(1e7 + k * 100); if (k === 1 && deg) { g.degats(deg); if (gj) gj.degats(deg); } // après une image : les voitures sont posées sur la grille, les pièces tombent de là
    if (cibles.length) { if (g.car.dist >= (tour - 1) * T.n) { const i = cibles.findIndex(c => ((g.car.idx - c + T.n) % T.n) < 8); if (i >= 0) { cibles.splice(i, 1); await prise(); if (!cibles.length) break; } } }
    else if (Math.floor(g.t / pas) > dernier && g.t > 0.5) { dernier = Math.floor(g.t / pas); await prise(); }
    if (k % 30 === 0) await new Promise(r => setTimeout(r, 0));
  }
  gl.finish(); const t0 = performance.now(); for (let i = 0; i < 200; i++, k++) { g.frame(1e7 + k * 100); gl.finish(); }
  const bilan = { carte, vues, erreurs, msParImage: +((performance.now() - t0) / 200).toFixed(2), tour: +g.t.toFixed(1), glErreur: gl.getError() };
  await post(carte + '.json', JSON.stringify(bilan, null, 1)); log(JSON.stringify(bilan.erreurs) + '  ' + bilan.msParImage + ' ms par image'); document.title = 'FINI';
})();
</script>
</body>
</html>
