<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redline Racer</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* polices pixel embarquées (SIL Open Font License) ; tout le HUD est dessiné dans le canvas du jeu */
  @font-face { font-family: "Press Start 2P"; font-display: swap; src: url(assets/fonts/press-start-2p-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: DotGothic16; font-display: swap; src: url(assets/fonts/dotgothic16-game.woff2) format("woff2"); }
  /* loading screen: the menus' look (src/render/menu-ui.js): the start line dimmed, a dark leaning band, REDLINE in heat, RACER in chrome, a thin hot bar */
  #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background: #0a0c12 url(assets/start-line.webp) center / cover; color: #d8dce6; font: bold 12px Verdana, Tahoma, sans-serif; }
  #loading[hidden] { display: none; }
  #loading::before { content: ""; position: absolute; inset: 0; background: rgba(5,6,10,.72); }
  #loading::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .15; background: repeating-linear-gradient(0deg, transparent 0 2px, #000 2px 3px); }
  .loading-band { position: relative; width: 100%; padding: 2.2vh 0 2.6vh; background: #0a0c12; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); text-align: center; animation: boot-in 300ms ease-out both; }
  .loading-band::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: repeating-linear-gradient(-45deg, #ffd200 0 8px, #0a0c12 8px 16px); }
  #loading-title { margin: 0; font: italic 900 clamp(40px, 9vw, 112px)/1 "Arial Black", "Arial Bold", Arial, sans-serif; letter-spacing: -.02em; filter: drop-shadow(3px 3px 0 rgba(0,0,0,.6)); }
  #loading-title span { display: inline-block; padding: 0 .06em; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: .02em #0a0c12; }
  #loading-title span:first-child { background-image: linear-gradient(#fff6b0, #ffd200 50%, #ff8a00 55%, #e8361c); }
  #loading-title span + span { background-image: linear-gradient(#fff, #dfe6f2 45%, #7d889c 55%, #f4f6fa); }
  .loading-console { position: relative; width: min(420px, 70vw); margin-top: 5vh; text-align: center; }
  .loading-track { height: 5px; background: #000; outline: 1px solid rgba(150,190,255,.35); }
  #loading-fill { display: block; height: 100%; background: linear-gradient(90deg, #ffd200, #ff8a00 70%, #e8361c); transform: scaleX(0); transform-origin: left; transition: transform 150ms ease-out; }
  #loading-status { margin: 12px 0 0; font-size: 11px; letter-spacing: .08em; color: #ffd200; text-shadow: 1px 1px 0 #000; }
  #loading-circuit { margin: 4px 0 0; min-height: 1.4em; font-size: 10px; color: #8a97b0; text-shadow: 1px 1px 0 #000; }
  #loading-count { display: none; }
  #loading-retry { margin-top: 16px; padding: 10px 26px; border: 1px solid #fff0c8; background: linear-gradient(#ffc860, #ff9418 50%, #e06a08 50%, #ffa030); color: #0a0c12; font: italic 900 14px "Arial Black", Arial, sans-serif; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); cursor: pointer; }
  #loading-retry:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @keyframes boot-in { from { transform: translateX(-100%); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .loading-band { animation: none; } #loading-fill { transition: none; } }
  html, body { margin: 0; height: 100%; background: #08080c; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite" aria-busy="true">
  <div class="loading-band"><h1 id="loading-title"><span>REDLINE</span><span>RACER</span></h1></div>
  <div class="loading-console">
    <div class="loading-track" role="progressbar" aria-label="PREPARATION DU JEU" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="loading-fill"></span></div>
    <p id="loading-status">MISE EN ROUTE</p><span id="loading-count" aria-hidden="true">01 / 03</span>
    <p id="loading-circuit">REDLINE RACER</p>
    <button id="loading-retry" type="button" hidden>REESSAYER</button>
  </div>
</div>
<script defer src="src/data/map-assets.js"></script>
<script defer src="src/engine/loader.js"></script>
</body>
</html>
